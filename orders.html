<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders — BoostHive</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div class="dash-layout">
  <aside class="sidebar">
    <div class="logo">Boost<span>Hive</span></div>
    <nav class="sidebar-nav">
      <div class="nav-section">Main</div>
      <a href="dashboard.html" class="nav-item"><span class="icon">📊</span> Dashboard</a>
      <a href="new-order.html" class="nav-item"><span class="icon">➕</span> New Order</a>
      <a href="orders.html" class="nav-item active"><span class="icon">📋</span> My Orders</a>
      <div class="nav-section">Account</div>
      <a href="funds.html" class="nav-item"><span class="icon">💳</span> Add Funds</a>
      <a href="transactions.html" class="nav-item"><span class="icon">📜</span> Transactions</a>
      <a href="profile.html" class="nav-item"><span class="icon">👤</span> Profile</a>
    </nav>
    <div class="sidebar-bottom">
      <div class="user-info">
        <div class="user-avatar" id="sb-avatar">?</div>
        <div><div class="user-name" id="sb-name">...</div><div class="user-bal" id="sb-bal">$0.00</div></div>
      </div>
      <a href="login.html" class="nav-item" onclick="logout()"><span class="icon">🚪</span> Logout</a>
    </div>
  </aside>

  <div class="main-content">
    <div class="topbar">
      <h1>My Orders</h1>
      <div class="topbar-right">
        <span class="bal-badge" id="top-bal">$0.00</span>
        <button class="add-funds-btn" onclick="location.href='new-order.html'">+ New Order</button>
      </div>
    </div>
    <div class="page">
      <!-- Filters -->
      <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap;align-items:center">
        <input type="text" id="search-orders" placeholder="Search by ID or service..." oninput="renderOrders()" style="background:var(--card);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 14px;color:var(--text);font-size:13.5px;outline:none;width:240px">
        <select id="filter-status" onchange="renderOrders()" style="background:var(--card);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 14px;color:var(--text);font-size:13.5px;outline:none">
          <option value="">All Status</option>
          <option value="pending">Pending</option>
          <option value="processing">Processing</option>
          <option value="completed">Completed</option>
          <option value="partial">Partial</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <select id="filter-platform" onchange="renderOrders()" style="background:var(--card);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 14px;color:var(--text);font-size:13.5px;outline:none">
          <option value="">All Platforms</option>
          <option>Instagram</option><option>YouTube</option><option>TikTok</option>
          <option>Twitter</option><option>Facebook</option><option>Telegram</option>
        </select>
        <span id="order-count" style="font-size:13px;color:var(--muted);margin-left:auto"></span>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Service</th>
              <th>Link</th>
              <th>Quantity</th>
              <th>Start Count</th>
              <th>Remains</th>
              <th>Charge</th>
              <th>Status</th>
              <th>Date</th>
            </tr>
          </thead>
          <tbody id="orders-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
const user = requireAuth();
renderSidebar(user);

function renderOrders() {
  const q = document.getElementById('search-orders').value.toLowerCase();
  const statusF = document.getElementById('filter-status').value;
  const platformF = document.getElementById('filter-platform').value;

  let orders = getOrders().filter(o => o.userId === user.id);
  if (q) orders = orders.filter(o => String(o.id).includes(q) || o.serviceName.toLowerCase().includes(q) || o.link.toLowerCase().includes(q));
  if (statusF) orders = orders.filter(o => o.status === statusF);
  if (platformF) orders = orders.filter(o => o.platform === platformF);

  orders = orders.reverse();
  document.getElementById('order-count').textContent = `${orders.length} orders`;

  const tbody = document.getElementById('orders-body');
  if (!orders.length) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:32px">No orders found</td></tr>';
    return;
  }
  tbody.innerHTML = orders.map(o => `
    <tr>
      <td style="font-weight:700;color:var(--accent2)">#${o.id}</td>
      <td style="max-width:160px">
        <div style="font-size:13px;font-weight:600">${o.serviceName}</div>
        <div style="font-size:11.5px;color:var(--muted)">${o.platform}</div>
      </td>
      <td style="max-width:140px"><a href="${o.link}" target="_blank" style="color:var(--info);font-size:12px;word-break:break-all">${o.link.replace(/^https?:\/\//, '')}</a></td>
      <td>${o.quantity.toLocaleString()}</td>
      <td style="color:var(--muted)">${o.startCount !== undefined ? o.startCount.toLocaleString() : '—'}</td>
      <td style="color:var(--muted)">${o.remains !== undefined ? o.remains.toLocaleString() : '—'}</td>
      <td style="font-weight:600;color:var(--success)">$${o.charge.toFixed(4)}</td>
      <td><span class="badge-status badge-${o.status}">${o.status}</span></td>
      <td style="color:var(--muted);font-size:12px">${new Date(o.createdAt).toLocaleDateString()}</td>
    </tr>
  `).join('');
}

renderOrders();
</script>
</body>
</html>
