<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — BoostHive</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-page">
<div class="auth-box">
  <a href="/" class="logo">Boost<span>Hive</span></a>
  <h2>Welcome back</h2>
  <p class="auth-sub">Sign in to your account to continue</p>

  <div id="alert-box"></div>

  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
  </div>
  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Your password" autocomplete="current-password">
  </div>
  <div style="display:flex;justify-content:flex-end;margin:-8px 0 18px">
    <a href="forgot.html" style="font-size:13px;color:var(--accent2)">Forgot password?</a>
  </div>

  <button class="btn-primary btn-full" onclick="doLogin()">Sign In</button>

  <div class="auth-switch">
    Don't have an account? <a href="register.html">Create one free</a>
  </div>
</div>

<script>
function doLogin() {
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('password').value;
  const box = document.getElementById('alert-box');

  if (!email || !pw) {
    box.innerHTML = '<div class="alert alert-danger">Please fill in all fields.</div>';
    return;
  }

  // Check admin credentials
  if (email === 'admin@boosthive.com' && pw === 'admin123') {
    localStorage.setItem('bh_user', JSON.stringify({ id: 1, name: 'Admin', email, role: 'admin', balance: 9999 }));
    window.location.href = 'admin/dashboard.html';
    return;
  }

  // Check registered users
  const users = JSON.parse(localStorage.getItem('bh_users') || '[]');
  const user = users.find(u => u.email === email && u.password === pw);
  if (user) {
    localStorage.setItem('bh_user', JSON.stringify(user));
    window.location.href = 'dashboard.html';
  } else {
    box.innerHTML = '<div class="alert alert-danger">Invalid email or password.</div>';
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
